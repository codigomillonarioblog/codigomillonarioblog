            { q: "¿Qué es la banca minorista (Retail Banking)?", a: ["Servicios bancarios dirigidos al público general, pequeños ahorradores y consumidores particulares", "Banca de inversión de alto riesgo en bolsa", "Gestión de fondos soberanos estatales", "Préstamos internacionales entre países"], correct: 0 },
            { q: "¿Qué es la titulización de activos?", a: ["Transformación de créditos o préstamos ilíquidos en títulos negociables en los mercados financieros", "Hacerte accionista de un banco", "Vender propiedades inmobiliarias al contado", "Abrir cuentas en el extranjero"], correct: 0 },
            { q: "¿Qué es una tarjeta prepago?", a: ["Una tarjeta en la que cargas una cantidad de dinero específica antes de usarla, ideal para control de gastos o compras online", "Una tarjeta de crédito con saldo ilimitado", "Un documento de identidad bancaria", "Un crédito rápido de consumo"], correct: 0 },
            { q: "¿Qué es la provisión por insolvencia?", a: ["Fondos que los bancos reservan contablemente para cubrir posibles impagos de sus prestatarios", "Un seguro de vida para clientes de tarjetas", "Una multa por retraso en el pago de impuestos", "Las ganancias netas de un banco"], correct: 0 },
            { q: "¿Qué es el ratio de solvencia?", a: ["Indicador que mide la capacidad de una empresa o banco para hacer frente a todas sus deudas a largo plazo", "La cantidad de dinero en efectivo en caja", "El porcentaje de ahorro mensual personal", "El límite de crédito de una tarjeta"], correct: 0 },

            { q: "¿Qué es un test de estrés financiero?", a: ["Una simulación de escenarios económicos extremos para comprobar si un banco o cartera resiste una crisis grave", "Un examen psicológico para gestores de fondos", "Una prueba de esfuerzo físico en el banco", "Un cálculo de presupuesto mensual ajustado"], correct: 0 },
            { q: "¿Qué es el colateral en un préstamo?", a: ["Un activo o bien aportado en garantía para asegurar el cumplimiento del pago del préstamo", "Una comisión por apertura de cuenta", "Un interés adicional acumulado", "Un seguro contra incendios"], correct: 0 },
            { q: "¿Qué es la moratoria de un crédito?", a: ["Un aplazamiento temporal autorizado en el pago de las cuotas de un préstamo", "La cancelación definitiva de una deuda", "Una multa por impago acumulado", "Un aumento en la tasa de interés"], correct: 0 },
            { q: "¿Qué es el tipo de interés de blanqueo?", a: ["Un concepto no estándar o término confuso en finanzas formales", "Una tasa de interés fija anual", "El interés que cobra una tarjeta de crédito", "El rendimiento de un bono del estado"], correct: 0 },
            { q: "¿Qué es una cuenta de alta remuneración?", a: ["Una cuenta bancaria que ofrece un tipo de interés superior al promedio por mantener tus ahorros en ella", "Una cuenta con comisiones muy altas", "Una cuenta exclusiva para empresas multinacionales", "Un fondo de inversión en acciones"], correct: 0 },
            { q: "¿Qué es una tarjeta revolving?", a: ["Una tarjeta de crédito donde las compras se aplazan automáticamente pagando cuotas mensuales con intereses elevados", "Una tarjeta que gira sobre su propio eje", "Una tarjeta de débito sin comisiones", "Un monedero electrónico de criptomonedas"], correct: 0 },
            { q: "¿Qué es el coste efectivo de un préstamo?", a: ["El costo total real que pagas por el préstamo sumando intereses, comisiones y gastos asociados", "Únicamente el valor del capital prestado", "La tasa de interés nominal mensual", "El valor de las cuotas sin intereses"], correct: 0 },
            { q: "¿Qué es la prima de emisión de acciones?", a: ["El sobreprecio que pagan los inversores sobre el valor nominal de una acción en una ampliación de capital", "Una comisión que cobra el bróker por operar", "Un dividendo extraordinario trimestral", "Un impuesto bursátil gubernamental"], correct: 0 },
            { q: "¿Qué es una ampliación de capital?", a: ["Una operación financiera para aumentar los recursos propios de una empresa mediante emisión de nuevas acciones o aumento de valor", "Pedir un crédito bancario comercial", "Reducir las deudas con proveedores", "Repartir beneficios entre socios"], correct: 0 },
            { q: "¿Qué es la reducción de capital social?", a: ["Una operación para disminuir el capital social de una empresa por devolución de aportaciones o absorción de pérdidas", "Aumentar los ahorros de los socios", "Pedir un préstamo a largo plazo", "Comprar acciones de la competencia"], correct: 0 },
            { q: "¿Qué es una OPA (Oferta Pública de Adquisición)?", a: ["Una oferta pública dirigida a los accionistas de una empresa para comprar todas o parte de sus acciones y controlarla", "Una oferta de empleo en bolsa", "El cierre fiscal de una compañía", "Un fondo de inversión en start-ups"], correct: 0 },
            { q: "¿Qué es una OPA hostil?", a: ["Una OPA lanzada sin el consentimiento ni la aprobación previa del consejo de administración de la empresa afectada", "Una oferta de trabajo mal pagada", "Un impuesto extraordinario de aduanas", "Una demanda judicial por deudas"], correct: 0 },
            { q: "¿Qué es una fusión de empresas?", a: ["La unión jurídica de dos o más empresas en una sola organización integrada", "La quiebra simultánea de dos compañías", "La compra de acciones menores en bolsa", "Un préstamo entre sociedades mercantiles"], correct: 0 },
            { q: "¿Qué es la absorción empresarial?", a: ["Una operación donde una empresa extingue su personalidad jurídica integrándose en otra ya existente que la absorbe", "Un crédito bancario de refinanciación", "La compra de material de oficina", "Un fondo de inversión privado"], correct: 0 },
            { q: "¿Qué es la escisión de empresas?", a: ["La división de una empresa en dos o más sociedades independientes", "La unión de dos corporaciones grandes", "La quiebra de una filial comercial", "Un aumento de capital social"], correct: 0 },
            { q: "¿Qué es el fondo de comercio (Goodwill)?", a: ["Un activo intangible que representa el valor de la marca, prestigio y clientela de una empresa adquirida", "Una caja de ahorros solidaria", "Los beneficios netos anuales", "El dinero en efectivo en caja"], correct: 0 },
            { q: "¿Qué son los activos intangibles?", a: ["Bienes sin sustancia física pero con valor económico (patentes, marcas, derechos de autor)", "Dinero en efectivo y monedas", "Bienes raíces y vehículos de empresa", "Acciones físicas en papel"], correct: 0 },
            { q: "¿Qué son los activos tangibles?", a: ["Bienes que tienen existencia física y se pueden tocar (maquinaria, inmuebles, inventario)", "Derechos de propiedad intelectual", "Marcas registradas y patentes", "Acciones digitales en bolsa"], correct: 0 },
            { q: "¿Qué es la depreciación contable?", a: ["La pérdida sistemática de valor contable de los activos tangibles por el paso del tiempo o su uso", "La subida de precio de una casa", "Una ganancia en la bolsa de valores", "Un impuesto municipal anual"], correct: 0 },
            { q: "¿Qué es la amortización de activos intangibles?", a: ["La distribución sistemática del costo de un activo intangible a lo largo de su vida útil estimada", "El pago de una deuda de tarjeta", "Un préstamo bancario a largo plazo", "El cálculo de los intereses de un bono"], correct: 0 },
            { q: "¿Qué es el cash flow libre apalancado?", a: ["El flujo de caja disponible para los accionistas después de pagar deudas e intereses financieros", "El dinero gastado en ocio personal", "Un subsidio estatal para empresas", "El saldo total de una cuenta de ahorro"], correct: 0 },
            { q: "¿Qué es el EBITDA?", a: ["Beneficio antes de intereses, impuestos, depreciaciones y amortizaciones", "El sueldo neto mensual de un trabajador", "El total de deudas de una empresa", "El valor de las acciones en bolsa"], correct: 0 },
            { q: "¿Qué es el beneficio neto contable?", a: ["El resultado final de restar todos los gastos, impuestos y amortizaciones a los ingresos totales", "El total de ingresos brutos de ventas", "El dinero disponible en el cajero automático", "El capital inicial aportado por los socios"], correct: 0 },
            { q: "¿Qué es la rentabilidad financiera (ROE)?", a: ["Indicador que mide el rendimiento obtenido sobre los fondos propios de los socios o accionistas", "El interés que paga una cuenta de ahorros", "El porcentaje de impuestos anuales", "El costo de mantenimiento de un crédito"], correct: 0 },
            { q: "¿Qué es la rentabilidad económica (ROA)?", a: ["Indicador que mide la capacidad de los activos totales de una empresa para generar beneficios operativos", "El rendimiento de las acciones tecnológicas", "El interés simple de un bono gubernamental", "El sueldo bruto de los empleados"], correct: 0 },
            { q: "¿Qué es el fondo de maniobra negativo?", a: ["Cuando el activo corriente es menor que el pasivo corriente, indicando posibles problemas de liquidez a corto plazo", "Cuando tienes muchos ahorros en el banco", "Cuando tus inversiones dan mucha ganancia", "Cuando el presupuesto está perfectamente equilibrado"], correct: 0 },
            { q: "¿Qué es el periodo medio de cobro?", a: ["El tiempo promedio que tarda una empresa en cobrar de sus clientes por las ventas realizadas", "El tiempo que tardas en pagar tu tarjeta", "El plazo de una hipoteca bancaria", "El tiempo de entrega de un producto"], correct: 0 },
            { q: "¿Qué es el periodo medio de pago?", a: ["El tiempo promedio que tarda una empresa en pagar a sus proveedores por las compras efectuadas", "El plazo para devolver un préstamo personal", "El tiempo que tardas en recibir tu sueldo", "La duración de un depósito a plazo fijo"], correct: 0 },
            { q: "¿Qué es el fondo de reserva legal de una sociedad?", a: ["Una parte de los beneficios que la ley obliga a reservar para proteger el capital social de la empresa", "Un ahorro para las vacaciones de los jefes", "Un fondo para pagar multas de tráfico", "Una cuenta secreta en el extranjero"], correct: 0 },
            { q: "¿Qué es una acción preferente?", a: ["Acción que otorga prioridad en el cobro de dividendos frente a las ordinarias, pero usualmente sin derecho a voto", "Una acción que siempre sube de precio en bolsa", "Un bono del estado a largo plazo", "Una tarjeta de crédito VIP"], correct: 0 },
            { q: "¿Qué es una acción ordinaria?", a: ["Título que representa propiedad en una empresa y otorga derechos políticos (voto) y económicos (dividendos)", "Una acción común sin valor de mercado", "Un bono de deuda bancaria", "Una participación en un fondo de pensiones"], correct: 0 },
            { q: "¿Qué es el warrant financiero?", a: ["Un derivado financiero que da derecho a comprar o vender un activo subyacente a un precio determinado en una fecha futura", "Una garantía de electrodomésticos", "Un cheque bancario sin fondos", "Un contrato de alquiler de vivienda"], correct: 0 },
            { q: "¿Qué es un fondo monetario offshore?", a: ["Un fondo de inversión monetario domiciliado en un país extranjero, a menudo con ventajas fiscales", "Una cuenta de ahorros en la esquina de tu barrio", "Un cajero automático nocturno", "Un préstamo personal online"], correct: 0 },
            { q: "¿Qué es la banca de proximidad?", a: ["Modelo de banca tradicional basado en una amplia red de sucursales físicas y atención personal cercana", "Banca exclusivamente digital por internet", "Cajeros automáticos automáticos sin personal", "Fondos de inversión en criptomonedas"], correct: 0 },
            { q: "¿Qué es el open banking (banca abierta)?", a: ["Sistema que permite a terceros (fintechs) acceder a datos bancarios de clientes mediante APIs con su consentimiento", "Robar contraseñas de cuentas ajenas", "Dejar las puertas del banco abiertas de noche", "Cajeros automáticos sin comisiones"], correct: 0 },
            { q: "¿Qué es una Fintech?", a: ["Empresa que utiliza la tecnología para ofrecer servicios financieros innovadores y eficientes", "Una marca de ropa para banqueros", "Un tipo de criptomoneda volátil", "Una entidad gubernamental de impuestos"], correct: 0 },
            { q: "¿Qué es el crowdfunding de donación?", a: ["Financiación colectiva donde los aportantes no esperan retorno financiero, sino apoyar una causa benéfica", "Invertir en start-ups para ganar dividendos", "Pedir un préstamo a un familiar directo", "Comprar acciones en la bolsa de valores"], correct: 0 },
            { q: "¿Qué es el crowdfunding de recompensa?", a: ["Financiación colectiva donde los mecenas reciben un producto, servicio o reconocimiento a cambio de su aportación", "Donar dinero sin recibir nada a cambio", "Un crédito bancario tradicional con aval", "Un fondo de inversión inmobiliaria"], correct: 0 },
            { q: "¿Qué es el capital semilla corporativo?", a: ["Inversión de capital realizada por grandes corporaciones en start-ups innovadoras vinculadas a su sector", "Ahorros de los empleados de una empresa", "Préstamos rápidos para comprar material de oficina", "Un fondo de pensiones privado"], correct: 0 },
            { q: "¿Qué es el descuento comercial de efectos?", a: ["Operación financiera donde un banco anticipa a una empresa el importe de una letra de cambio antes de su vencimiento", "Rebajas en tiendas por temporada", "Descuentos en comisiones de cajeros", "Un plan de ahorro familiar"], correct: 0 },
            { q: "¿Qué es la línea de descuento?", a: ["Un límite de crédito concedido por un banco para anticipar el cobro de efectos comerciales", "Una tarjeta de descuento en supermercados", "Un préstamo hipotecario a plazos fijos", "Una cuenta de ahorros con intereses altos"], correct: 0 },
            { q: "¿Qué es el confirming internacional?", a: ["Servicio de gestión de pagos a proveedores extranjeros con opción de financiación y anticipo", "Un envío de dinero por remesas familiares", "Una transferencia SEPA en euros", "Un cheque de viajero impreso"], correct: 0 },
            { q: "¿Qué es el leasing internacional (cross-border leasing)?", a: ["Un contrato de arrendamiento financiero donde el arrendador y el arrendatario están en países distintos", "Alquilar un coche en el aeropuerto", "Un préstamo personal en el extranjero", "Comprar acciones de una multinacional"], correct: 0 },
            { q: "¿Qué es el riesgo de tipo de cambio?", a: ["El riesgo de sufrir pérdidas económicas debido a la fluctuación adversa en el valor de las divisas", "El riesgo de que te roben moneda extranjera", "El riesgo de inflación en tu país local", "El riesgo de que el cajero falle al dar billetes"], correct: 0 },
            { q: "¿Qué es la cobertura de tipo de cambio (Hedging de divisas)?", a: ["Estrategia financiera para protegerse frente a las fluctuaciones desfavorables en el tipo de cambio", "Comprar dólares y guardarlos en casa", "Cambiar de moneda local cada semana", "Pagar comisiones altas en el banco"], correct: 0 },
            { q: "¿Qué es el mercado de divisas (Forex)?", a: ["El mercado global descentralizado donde se negocian las diferentes monedas del mundo", "La bolsa de valores local de acciones", "Un mercado de materias primas agrícolas", "Una casa de empeños de oro"], correct: 0 },
            { q: "¿Qué es un par de divisas en Forex?", a: ["La cotización simultánea de dos monedas en la que una se valora en función de la otra (ej. EUR/USD)", "Dos billetes falsos juntos", "Una cuenta bancaria compartida", "Un préstamo en dos monedas distintas"], correct: 0 },
            { q: "¿Qué es la moneda base en Forex?", a: ["La primera moneda que aparece en un par de divisas, la cual se compra o vende frente a la cotizada", "La moneda oficial de tu país de residencia", "El dólar estadounidense por defecto", "La moneda con menor valor en el mercado"], correct: 0 },
            { q: "¿Qué es la moneda cotizada o contraparte en Forex?", a: ["La segunda moneda en un par de divisas, que sirve para expresar el valor de la moneda base", "La moneda que tienes guardada en el banco", "El oro físico en lingotes de las reservas", "La divisa local del inversor"], correct: 0 },
            { q: "¿Qué es el apalancamiento operativo alto?", a: ["Cuando una empresa tiene costos fijos elevados, de modo que un pequeño cambio en ventas genera un gran impacto en beneficios", "Cuando pides muchos préstamos al banco", "Cuando ahorras el 50% de tu sueldo", "Cuando tus inversiones no tienen riesgo"], correct: 0 }
        ];

        const quizQuestionsEl = document.getElementById("quizQuestions");
        const indicator = document.getElementById("questionIndicator");
        const nextQuestionBtn = document.getElementById("nextQuestionBtn");
        const submitBtn = document.getElementById("submitQuiz");
        const newQuizBtn = document.getElementById("newQuiz");
        const quizModal = document.getElementById("quizModal");
        const resultContainer = document.getElementById("quizResult");
        const moneyDisplay = document.getElementById("moneyDisplay");

        let quizQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let playerMoney = 10000;
        const penaltyPerMistake = 1000;

        function getRandomQuestions(num) {
            const shuffled = [...questions].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, Math.min(num, shuffled.length));
        }

        function updateMoneyDisplay(deducted = false) {
            moneyDisplay.textContent = `$${playerMoney.toLocaleString()}`;
            if (deducted) {
                moneyDisplay.classList.add('money-deduct');
                setTimeout(() => moneyDisplay.classList.remove('money-deduct'), 600);
            }
        }

        function renderQuestion() {
            const q = quizQuestions[currentIndex];
            quizQuestionsEl.innerHTML = `
                <h3 class="font-semibold text-lg md:text-xl mb-6 text-slate-100">${q.q}</h3>
                <div class="space-y-3">
                    ${q.a.map((option, idx) => `
                        <label class="option-btn flex items-center gap-3 cursor-pointer py-3.5 px-5 rounded-2xl text-slate-200 text-sm md:text-base ${userAnswers[currentIndex] == idx ? 'selected' : ''}">
                            <input type="radio" name="q${currentIndex}" value="${idx}" class="accent-amber-500 w-4 h-4" ${userAnswers[currentIndex] == idx ? 'checked' : ''}>
                            <span>${option}</span>
                        </label>
                    `).join('')}
                </div>
            `;

            indicator.textContent = `Pregunta ${currentIndex + 1}/${quizQuestions.length}`;

            nextQuestionBtn.style.display = currentIndex < quizQuestions.length - 1 ? "inline-block" : "none";
            submitBtn.style.display = currentIndex === quizQuestions.length - 1 ? "inline-block" : "none";
            submitBtn.disabled = currentIndex === quizQuestions.length - 1 && userAnswers[currentIndex] == null;

            document.querySelectorAll(`input[name="q${currentIndex}"]`).forEach(radio => {
                radio.onchange = () => {
                    userAnswers[currentIndex] = parseInt(radio.value);
                    document.querySelectorAll('.option-btn').forEach(lbl => lbl.classList.remove('selected'));
                    radio.closest('label').classList.add('selected');
                    if (currentIndex === quizQuestions.length - 1) submitBtn.disabled = false;
                };
            });
        }

        function calculateScore() {
            let score = 0;
            quizQuestions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) {
                    score++;
                } else {
                    playerMoney = Math.max(0, playerMoney - penaltyPerMistake);
                }
            });
            return score;
        }

        function showResults() {
            playerMoney = 10000;
            const score = calculateScore();
            let message = "";
            if (score === 10) {
                message = `¡Impecable! Acertaste todas las preguntas y conservaste tus <span class="text-emerald-400 font-bold">$${playerMoney.toLocaleString()}</span> íntegros. ¡Eres un maestro de las finanzas!`;
            } else if (score >= 7) {
                message = `¡Muy bien! Tienes bases sólidas. Obtuviste ${score} de ${quizQuestions.length} correctas. Tu capital final fue de <span class="text-emerald-400 font-bold">$${playerMoney.toLocaleString()}</span>.`;
            } else if (score >= 4) {
                message = `Buen intento. Obtuviste ${score} de ${quizQuestions.length} correctas. Entre penalizaciones, tu capital final bajó a <span class="text-amber-400 font-bold">$${playerMoney.toLocaleString()}</span>. ¡A repasar conceptos!`;
            } else {
                message = `Obtuviste ${score} de ${quizQuestions.length} correctas. Las malas decisiones financieras costaron caro y tu capital llegó a <span class="text-red-400 font-bold">$${playerMoney.toLocaleString()}</span>. ¡Sigue aprendiendo!`;
            }

            resultContainer.innerHTML = `
                <p class="text-lg font-semibold text-slate-100 mb-2">Puntuación: ${score} / ${quizQuestions.length}</p>
                <p class="text-sm text-slate-300">${message}</p>
            `;
            quizModal.classList.remove("hidden");
        }

        function initQuiz() {
            quizQuestions = getRandomQuestions(10);
            currentIndex = 0;
            userAnswers = new Array(quizQuestions.length);
            playerMoney = 10000;
            updateMoneyDisplay();
            submitBtn.disabled = true;
            quizModal.classList.add("hidden");
            renderQuestion();
        }

        nextQuestionBtn.addEventListener("click", () => {
            if (userAnswers[currentIndex] == null) {
                alert("Por favor, selecciona una respuesta antes de continuar.");
                return;
            }
            if (userAnswers[currentIndex] !== quizQuestions[currentIndex].correct) {
                playerMoney = Math.max(0, playerMoney - penaltyPerMistake);
                updateMoneyDisplay(true);
            }
            currentIndex++;
            renderQuestion();
        });

        submitBtn.addEventListener("click", () => {
            if (userAnswers[currentIndex] !== quizQuestions[currentIndex].correct) {
                playerMoney = Math.max(0, playerMoney - penaltyPerMistake);
            }
            showResults();
        });

        newQuizBtn.addEventListener("click", initQuiz);

        initQuiz();
    </script>
