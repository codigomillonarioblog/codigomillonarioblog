name: Generar Sitemap Automático

on:
  push:
    branches:
      - main

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generar Sitemap XML
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Generar Sitemap
        uses: Cicirello/generate-sitemap@v1
        with:
          base-url-path: https://codigomillonario.blog/
          sitemap-format: xml
          ignore-files: '/assets/**, /css/**, /js/**, 404.html'

      - name: Guardar Sitemap en el Repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualización automática de sitemap.xml"
          file_pattern: "sitemap.xml"
