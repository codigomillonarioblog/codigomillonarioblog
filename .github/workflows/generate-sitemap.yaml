name: Generar Sitemap Automático

on:
push:
branches:
- main
paths-ignore:
- "sitemap.xml"
workflow_dispatch:

permissions:
contents: write

jobs:
generate-sitemap:
runs-on: ubuntu-latest

steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Generar sitemap.xml
    shell: bash
    run: |
      python <<'PY'
      import os
      import xml.etree.ElementTree as ET

      BASE_URL = "https://codigomillonario.blog"

      IGNORE_DIRS = {
          ".git",
          ".github",
          "assets",
          "css",
          "js",
          "img",
          "images"
      }

      IGNORE_FILES = {
          "404.html"
      }

      urls = set()

      for root, dirs, files in os.walk("."):
          dirs[:] = sorted(
              directory
              for directory in dirs
              if directory not in IGNORE_DIRS
          )

          for filename in sorted(files):
              if not filename.lower().endswith(".html"):
                  continue

              if filename.lower() in IGNORE_FILES:
                  continue

              filepath = os.path.join(root, filename)

              relative_path = os.path.relpath(
                  filepath, "."
              ).replace(os.sep, "/")

              if relative_path == "index.html":
                  url_path = "/"
              elif relative_path.endswith("/index.html"):
                  url_path = "/" + relative_path[:-11] + "/"
              else:
                  url_path = "/" + relative_path

              url = BASE_URL + url_path
              urls.add(url)

      if not urls:
          raise RuntimeError(
              "No se encontraron páginas HTML. "
              "Se cancela la generación del sitemap."
          )

      namespace = (
          "http://www.sitemaps.org/schemas/sitemap/0.9"
      )

      ET.register_namespace("", namespace)

      urlset = ET.Element(
          f"{{{namespace}}}urlset"
      )

      for url in sorted(urls):
          url_element = ET.SubElement(
              urlset, f"{{{namespace}}}url"
          )

          loc = ET.SubElement(
              url_element, f"{{{namespace}}}loc"
          )

          loc.text = url

      tree = ET.ElementTree(urlset)
      ET.indent(tree, space="  ")

      tree.write(
          "sitemap.xml",
          encoding="utf-8",
          xml_declaration=True
      )

      print(
          f"Sitemap generado correctamente: "
          f"{len(urls)} URL encontradas."
      )
      PY

  - name: Guardar sitemap actualizado
    uses: stefanzweifel/git-auto-commit-action@v5
    with:
      commit_message: "chore: actualizar sitemap.xml"
      file_pattern: sitemap.xml